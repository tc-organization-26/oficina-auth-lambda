name: Promover branches por Pull Request

on:
  push:
    branches:
      - fase-3
      - homologacao

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  abrir-pr:
    name: Abrir PR para o próximo ambiente
    runs-on: ubuntu-latest

    steps:
      - name: Definir fluxo de promoção
        id: flow
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            fase-3)
              echo "base=homologacao" >> "$GITHUB_OUTPUT"
              echo "title=chore: promover fase-3 para homologação" >> "$GITHUB_OUTPUT"
              ;;
            homologacao)
              echo "base=main" >> "$GITHUB_OUTPUT"
              echo "title=chore: promover homologação para produção" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Criar branch homologacao quando ainda não existir
        if: steps.flow.outputs.base == 'homologacao'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.flow.outputs.base }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_BRANCH}" >/dev/null 2>&1; then
            echo "A branch ${BASE_BRANCH} já existe."
            exit 0
          fi

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BASE_BRANCH}" \
            -f sha="$main_sha"
          echo "Branch ${BASE_BRANCH} criada a partir de main."

      - name: Abrir ou manter Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.flow.outputs.base }}
          PR_TITLE: ${{ steps.flow.outputs.title }}
        shell: bash
        run: |
          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "O PR #${existing_pr} já está aberto. Os novos commits foram adicionados automaticamente."
            exit 0
          fi

          ahead="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${GITHUB_REF_NAME}" \
            --jq '.ahead_by')"

          if [[ "$ahead" == "0" ]]; then
            echo "Não há commits para promover de ${GITHUB_REF_NAME} para ${BASE_BRANCH}."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$GITHUB_REF_NAME" \
            --title "$PR_TITLE" \
            --body "Pull Request criado automaticamente após push em \`${GITHUB_REF_NAME}\`.
              Valide os checks e faça o merge manualmente para promover o código para \`${BASE_BRANCH}\`."
