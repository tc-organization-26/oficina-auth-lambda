name: CI/CD - Lambda de Autenticacao
on:
  pull_request:
  push:
    branches: [main, master, homologacao]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'hom' }}
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m unittest discover -s tests
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }
      - working-directory: terraform
        run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
  deploy:
    if: github.event_name == 'push'
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - working-directory: terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=oficina/auth/${TF_VAR_environment}.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - working-directory: terraform
        run: terraform apply -auto-approve
      - name: Atualizar segredo de autenticacao
        env:
          AUTH_LOGIN: ${{ secrets.AUTH_LOGIN }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        shell: bash
        run: |
          secret_id="oficina-${TF_VAR_environment}/auth"
          jq -n '{adminLogin: env.AUTH_LOGIN, adminPassword: env.AUTH_PASSWORD, jwtSecret: env.JWT_SECRET, adminId: env.ADMIN_ID}' \
            | aws secretsmanager put-secret-value --secret-id "$secret_id" --secret-string file:///dev/stdin

